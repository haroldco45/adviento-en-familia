<style>
:root{--night:#12203a;--night2:#1c2f52;--gold:#f2b84b;--ember:#e4572e;--cream:#fff7ea;--ink:#1e2433;--muted:#6b7280;--green:#2f6b4f}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Nunito,system-ui,sans-serif;background:var(--cream);color:var(--ink);overflow-x:hidden}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:0}
.wrap{max-width:560px;margin:0 auto;position:relative}

/* barra */
.top{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:linear-gradient(#12203ae6,#12203a00);color:#fff}
.brand{font-weight:800;letter-spacing:.5px;font-size:13px;opacity:.9}
.top{transition:background .3s}.top.solid{background:#12203af2;box-shadow:0 4px 14px #0003}
.lang{background:#ffffff22;color:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:12px;backdrop-filter:blur(6px)}

/* hero */
.hero{position:relative;min-height:100svh;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:var(--night)}
.slides,.slides div{position:absolute;inset:0}
.slides div{background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease;animation:kb 14s ease-in-out infinite alternate}
.slides div.on{opacity:1}
@keyframes kb{from{transform:scale(1.05) translate(0,0)}to{transform:scale(1.2) translate(-2%,-3%)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#12203a55 0%,#12203a33 35%,#12203af2 78%)}
.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;z-index:2;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:translateY(0)}50%{opacity:1;transform:translateY(-8px)}}
.hero-in{position:relative;z-index:3;padding:0 22px 34px;text-align:center}
.kicker{font-family:Fraunces,serif;font-weight:800;letter-spacing:3px;color:var(--gold);font-size:20px}
.script{font-family:"Great Vibes",cursive;font-size:clamp(68px,20vw,104px);line-height:.95;color:#fff;text-shadow:0 4px 24px #0008;margin:2px 0 8px}
.sub{font-family:Fraunces,serif;font-size:24px;font-weight:600}
.sub2{font-style:italic;opacity:.9;margin:6px auto 0;max-width:340px}
.tag{margin:18px 0 0;font-size:19px;font-weight:600}
.tag b{color:var(--gold)}
.cta{display:block;width:100%;max-width:380px;margin:22px auto 12px;background:var(--ember);color:#fff;font-weight:800;font-size:19px;padding:17px 20px;border-radius:16px;box-shadow:0 6px 0 #a83a1b,0 12px 30px #0006;animation:pulse 2.4s infinite}
.cta:active{transform:translateY(3px);box-shadow:0 3px 0 #a83a1b}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
.count{display:flex;justify-content:center;gap:8px;margin-top:6px}
.count div{background:#ffffff1c;border:1px solid #ffffff33;backdrop-filter:blur(6px);border-radius:12px;min-width:66px;padding:8px 4px}
.count b{display:block;font-family:Fraunces,serif;font-size:26px}
.count span{font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.85}
.when{margin-top:10px;font-weight:800;letter-spacing:1.5px;font-size:13px}
.when em{color:var(--gold);font-style:normal}

/* secciones */
section{padding:34px 18px}
h2{font-family:Fraunces,serif;font-size:28px;line-height:1.1;margin-bottom:6px;color:var(--night)}
.lead{color:var(--muted);margin-bottom:18px}

/* hoy */
.today{background:linear-gradient(160deg,var(--night),var(--night2));color:#fff;border-radius:26px;margin:-26px 12px 0;position:relative;z-index:5;padding:22px;box-shadow:0 20px 40px #12203a40}
.today h2{color:#fff;font-size:22px}
.today .date{color:var(--gold);font-weight:800;font-size:13px;letter-spacing:1px;text-transform:uppercase}
.today p{opacity:.9;margin-top:6px}
.prog{display:flex;align-items:center;gap:16px;margin-top:16px}
.ring{--p:0;width:78px;height:78px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),#ffffff22 0);display:grid;place-items:center;flex:none}
.ring b{background:var(--night);width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-family:Fraunces,serif;font-size:18px}
.btn2{background:var(--gold);color:var(--night);font-weight:800;padding:12px 16px;border-radius:12px;margin-top:14px}
.btn3{background:#ffffff1f;color:#fff;font-weight:800;padding:12px 16px;border-radius:12px;margin-top:14px}

/* corona */
.weeks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.wk{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:1/1.1;color:#fff;background:#333 center/cover}
.wk::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 30%,#000c)}
.wk .t{position:absolute;z-index:2;bottom:12px;left:12px;right:12px}
.wk small{font-weight:800;letter-spacing:1px;font-size:11px;color:var(--gold);text-transform:uppercase}
.wk b{display:block;font-family:Fraunces,serif;font-size:21px}
.wk.lit{outline:3px solid var(--gold);box-shadow:0 0 26px #f2b84b88}
.wk.lit::before{content:"";position:absolute;z-index:2;top:12px;right:12px;width:12px;height:18px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(#fff 15%,#ffd36b 45%,#e4572e 90%);box-shadow:0 0 18px 6px #f2b84baa;animation:flick .25s infinite alternate}
@keyframes flick{to{transform:scale(1.08) rotate(3deg)}}

/* calendario */
.days{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 18px 16px;margin:0 -18px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:150px;height:210px;border-radius:20px;overflow:hidden;position:relative;scroll-snap-align:start;color:#fff;text-align:left;background:#333 center/cover;transition:transform .25s}
.day:active{transform:scale(.96)}
.day::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 35%,#000d)}
.day .n{position:absolute;top:10px;left:10px;z-index:2;background:#000a;border-radius:999px;padding:3px 10px;font-weight:800;font-size:12px}
.day .w{position:absolute;bottom:12px;left:12px;right:10px;z-index:2}
.day .w small{display:block;font-size:11px;opacity:.85;font-weight:800;text-transform:uppercase;letter-spacing:.6px}
.day .w b{font-family:Fraunces,serif;font-size:19px;line-height:1.05}
.day.done{outline:3px solid var(--gold)}
.day.done .n{background:var(--gold);color:var(--night)}
.day.is-today{outline:3px solid var(--ember);animation:glow 2s infinite}
@keyframes glow{50%{box-shadow:0 0 22px var(--ember)}}
.day.nov .n::after{content:" · Novena";color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:7px;margin-top:6px}
.cell{aspect-ratio:1;border-radius:12px;background:#fff;border:1px solid #eadfcf;font-weight:800;color:var(--night);display:grid;place-items:center;font-size:15px}
.cell.done{background:var(--gold);border-color:var(--gold)}
.cell.is-today{background:var(--ember);color:#fff;border-color:var(--ember)}
.cell.nov{box-shadow:inset 0 -4px 0 var(--green)}

/* novena */
.nov-box{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 10px 30px #12203a14}
.nov-img{height:200px;background:#333 center/cover;position:relative}
.nov-img::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000,#12203acc)}
.nov-img h3{position:absolute;z-index:2;bottom:14px;left:16px;right:16px;color:#fff;font-family:Fraunces,serif;font-size:24px}
.nov-in{padding:18px}
.nov-in ol{margin:10px 0 0 20px;line-height:1.7}
.gozo{margin-top:14px;background:var(--cream);border-left:4px solid var(--gold);padding:12px 14px;border-radius:10px;font-family:Fraunces,serif;font-style:italic;font-size:18px}

/* familia */
.fam{display:flex;gap:8px;margin-top:10px}
.fam input{flex:1;border:1px solid #ddd;border-radius:12px;padding:12px;font:inherit}
.fam button{background:var(--night);color:#fff;border-radius:12px;padding:0 16px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:#fff;border:1px solid #eadfcf;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.chip button{background:none;color:var(--ember);margin-left:6px;font-weight:800}
.acts{display:grid;gap:10px;margin-top:16px}
.act{display:block;text-align:center;text-decoration:none;font-weight:800;padding:15px;border-radius:14px}
.act.wa{background:#1f9d55;color:#fff}
.act.cal{background:var(--night);color:#fff}


/* novena completa */
.ntabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.ntabs::-webkit-scrollbar{display:none}
.ntab{flex:none;background:#fff;border:1px solid #eadfcf;border-radius:14px;padding:9px 13px;font-weight:800;color:var(--night);text-align:center;line-height:1.1}
.ntab small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.ntab.on{background:var(--night);color:#fff;border-color:var(--night)}
.ntab.on small{color:var(--gold)}
.ntab.hoy{outline:3px solid var(--ember)}
.tsize{display:flex;gap:8px;align-items:center;margin:0 0 12px;font-weight:700;color:var(--muted);font-size:14px}
.tsize button{background:#fff;border:1px solid #eadfcf;border-radius:10px;min-width:44px;height:40px;font-weight:800;color:var(--night)}
.rezo{font-size:calc(17px * var(--fs,1))}
.paso{background:#fff;border-radius:18px;margin-bottom:10px;box-shadow:0 4px 14px #12203a0d;overflow:hidden}
.paso summary{list-style:none;cursor:pointer;padding:15px 16px;font-weight:800;color:var(--night);display:flex;justify-content:space-between;gap:10px;align-items:center}
.paso summary::-webkit-details-marker{display:none}
.paso summary::after{content:"+";font-size:22px;color:var(--ember);transition:.25s}
.paso[open] summary::after{transform:rotate(45deg)}
.paso summary .k{font-size:11px;letter-spacing:1.4px;color:var(--ember);text-transform:uppercase;display:block}
.paso .tx{padding:0 16px 16px;line-height:1.7}
.paso .tx p{margin-bottom:10px}
.paso .nota{font-style:italic;color:var(--green);font-weight:700}
.paso.cons{border:2px solid var(--gold)}
.estrofa{margin:12px 0 4px}
.coro{font-family:Fraunces,serif;font-style:italic;color:var(--ember);font-weight:600}
.vill{border-radius:20px;overflow:hidden;margin-bottom:12px;background:#fff;box-shadow:0 6px 18px #12203a12}
.vill summary{list-style:none;cursor:pointer;position:relative;height:120px;background:#333 center/cover;display:flex;align-items:flex-end;color:#fff}
.vill summary::-webkit-details-marker{display:none}
.vill summary::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#12203ae6,#12203a55)}
.vill summary .t{position:relative;z-index:2;padding:14px 16px}
.vill summary b{font-family:Fraunces,serif;font-size:22px;display:block}
.vill summary small{opacity:.85;font-weight:700}
.vill .tx{padding:14px 16px 18px;line-height:1.75}
.vill .tx p{margin-bottom:10px}
.fuente{font-size:12px;color:var(--muted);margin-top:8px}

/* recetas */
.recs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 18px 16px;margin:0 -18px}
.recs::-webkit-scrollbar{display:none}
.rec{flex:none;width:210px;height:250px;border-radius:22px;overflow:hidden;position:relative;scroll-snap-align:start;color:#fff;text-align:left;background-size:cover;background-position:center;box-shadow:0 10px 24px #12203a26;transition:transform .25s}
.rec:active{transform:scale(.96)}
.rec::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 30%,#000c)}
.rec .w{position:absolute;z-index:2;left:14px;right:14px;bottom:14px}
.rec b{font-family:Fraunces,serif;font-size:23px;line-height:1.05;display:block}
.rec small{display:block;opacity:.9;margin-top:4px;font-size:13px;line-height:1.35}
.rec .vd{position:absolute;z-index:2;top:12px;left:12px;background:#e4572e;border-radius:999px;padding:4px 10px;font-weight:800;font-size:11px;letter-spacing:.8px}
.fab{position:fixed;z-index:60;left:14px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--ember);color:#fff;font-weight:800;padding:13px 18px;border-radius:999px;box-shadow:0 8px 22px #e4572e66;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.fab.hide{display:none}
.vid{position:relative;aspect-ratio:16/9;background:#000;border-radius:0}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.rh{padding:18px 20px 6px}
.rh small{font-weight:800;letter-spacing:1.4px;color:var(--ember);text-transform:uppercase;font-size:12px}
.rh h3{font-family:Fraunces,serif;font-size:34px;line-height:1.05;color:var(--night)}
.rh p{color:var(--muted);margin-top:6px}
.ing{list-style:none}
.ing li{padding:10px 0 10px 34px;border-bottom:1px dashed #eadfcf;position:relative;cursor:pointer;line-height:1.45}
.ing li::before{content:"";position:absolute;left:0;top:11px;width:20px;height:20px;border-radius:6px;border:2px solid var(--gold)}
.ing li.ok{color:var(--muted);text-decoration:line-through}
.ing li.ok::before{background:var(--gold)}
.pas{counter-reset:p;list-style:none}
.pas li{counter-increment:p;position:relative;padding:0 0 14px 44px;line-height:1.6}
.pas li::before{content:counter(p);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--night);color:var(--gold);display:grid;place-items:center;font-weight:800}
.yt{display:block;text-align:center;text-decoration:none;font-weight:800;padding:15px;border-radius:14px;background:#c4302b;color:#fff;margin-top:10px}
.yt.wa{background:#1f9d55}
footer{background:var(--night);color:#cdd5e3;padding:28px 18px 40px;font-size:13px;text-align:center}
footer b{color:var(--gold)}
footer a{color:#fff}
.credits{opacity:.6;margin-top:12px;font-size:11px}

/* lector del día */
.sheet{position:fixed;inset:0;z-index:100;background:var(--cream);overflow-y:auto;transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sh-hero{height:46svh;min-height:280px;background:#333 center/cover;position:relative;color:#fff;display:flex;align-items:flex-end}
.sh-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(#12203a66,#12203a00 30%,#12203af0)}
.sh-hero .t{position:relative;z-index:2;padding:20px}
.sh-hero small{font-weight:800;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;font-size:12px}
.sh-hero h3{font-family:Fraunces,serif;font-size:38px;line-height:1}
.close{position:absolute;z-index:3;top:14px;right:14px;background:#000a;color:#fff;border-radius:999px;padding:8px 14px;font-weight:800}
.sh-body{padding:20px 20px 120px}
.verse{font-family:Fraunces,serif;font-size:21px;line-height:1.4;font-style:italic;color:var(--night)}
.ref{color:var(--muted);font-size:13px;margin:6px 0 20px;font-weight:700}
.blk{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 4px 14px #12203a0d}
.blk h4{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ember);margin-bottom:6px}
.blk p{line-height:1.6}
.blk.ch{background:var(--night);color:#fff}
.blk.ch h4{color:var(--gold)}
.markbar{position:fixed;z-index:101;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(#fff7ea00,#fff7ea 30%);display:none}
.markbar.show{display:block}
.markbar button{width:100%;max-width:520px;margin:0 auto;display:block;background:var(--ember);color:#fff;font-weight:800;font-size:17px;padding:16px;border-radius:14px}
.markbar button.ok{background:var(--green)}
.markbar button:disabled{background:#9aa3b2}
.toast{position:fixed;z-index:200;left:50%;bottom:90px;transform:translate(-50%,40px);opacity:0;background:var(--night);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;transition:.35s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.reveal{opacity:0;transform:translateY(24px);transition:.7s}
.reveal.in{opacity:1;transform:none}
</style>
</head>
<body>
<div class="top"><span class="brand">VIBRAS POSITIVAS HM</span><button class="lang" id="langBtn">EN</button></div>

<header class="hero" id="inicio">
  <div class="slides" id="slides"></div>

    <div class="kicker" data-t="kicker"></div>

</div>

<footer>

</footer>

<script>
/* ---------- Fotos reales (Wikimedia Commons) con respaldo ---------- */
const C=(f,w=1000)=>`https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(f)}?width=${w}`;
const PHOTOS=[

const resolved={};
function photo(i,w=1000){
  const [f,fb]=PHOTOS[i%PHOTOS.length];const key=i%PHOTOS.length+'_'+w;
  if(resolved[key])return resolved[key];
  const url=C(f,w);resolved[key]=url;
  const t=new Image();t.onerror=()=>{resolved[key]=fb;document.querySelectorAll(`[data-ph="${key}"]`).forEach(el=>el.style.backgroundImage=`url("${fb}")`)};t.src=url;
  return url;
}
function bg(el,i,w){const u=photo(i,w);el.dataset.ph=i%PHOTOS.length+'_'+w;el.style.backgroundImage=`url("${u}")`;}

/* ---------- Fechas en hora real de Colombia (UTC-5) ---------- */
const START=Date.UTC(2026,10,29,5,0,0); // 29 nov 2026 00:00 Bogotá
const DAY=864e5;
const nowCO=()=>Date.now();
function dayIndexNow(){return Math.floor((nowCO()-START)/DAY);} // 0 = día 1
function dateOf(i,lang){const d=new Date(START+i*DAY+5*3600e3);return d.toLocaleDateString(lang==='en'?'en-US':'es-CO',{weekday:'long',day:'numeric',month:'long',timeZone:'America/Bogota'});}
function shortDate(i,lang){const d=new Date(START+i*DAY+5*3600e3);return d.toLocaleDateString(lang==='en'?'en-US':'es-CO',{day:'numeric',month:'short',timeZone:'America/Bogota'});}

const D=[
["Esperanza","Hope","Isaías 9:2","Isaiah 9:2","El pueblo que andaba en tinieblas vio gran luz: los que moraban en tierra de sombra de muerte, luz resplandeció sobre ellos.","The people that walked in darkness have seen a great light: they that dwell in the land of the shadow of death, upon them hath the light shined.","Hoy empieza el Adviento. No hace falta tenerlo todo resuelto: basta con dejar una rendija abierta para que entre la luz.","Advent begins today. We don't need everything figured out: we only need to leave a crack open for the light to come in.","Pongan la corona de Adviento (o cuatro velas) en un lugar donde toda la familia la vea y enciendan juntos la primera.","Set up an Advent wreath (or four candles) where the whole family can see it and light the first one together."],
["Vigilancia","Watchfulness","Marcos 13:33","Mark 13:33","Mirad, velad y orad: porque no sabéis cuándo será el tiempo.","Take ye heed, watch and pray: for ye know not when the time is.","Velar es estar despiertos al bien que pasa cerca: una necesidad, una palabra amable, un momento con los nuestros.","To keep watch is to stay awake to the good happening around us: a need, a kind word, a moment with our people.","Esta noche, antes de dormir, cada uno cuenta un momento bueno del día.","Tonight, before bed, everyone shares one good moment from the day."],

["Gratitud","Gratitude","1 Tesalonicenses 5:18","1 Thessalonians 5:18","Dad gracias en todo; porque esta es la voluntad de Dios para con vosotros en Cristo Jesús.","In every thing give thanks: for this is the will of God in Christ Jesus concerning you.","Agradecer cambia la mirada: lo que teníamos por normal se vuelve regalo.","Gratitude changes how we see: what seemed ordinary becomes a gift.","En la comida, cada uno da gracias por una persona de la familia, diciéndolo en voz alta.","At mealtime, everyone gives thanks out loud for one family member."],
["Perdón","Forgiveness","Colosenses 3:13","Colossians 3:13","De la manera que Cristo os perdonó, así también hacedlo vosotros.","Even as Christ forgave you, so also do ye.","Perdonar no es olvidar lo que pasó, es decidir que eso ya no manda en nuestro corazón.","Forgiving isn't forgetting what happened; it's deciding it no longer rules our heart.","Llamen o escriban a alguien con quien haya una distancia, solo para saludar.","Call or text someone you've drifted from, just to say hello."],
["Preparación","Preparation","Lucas 3:5","Luke 3:5","Todo valle se henchirá, y bajaráse todo monte y collado.","Every valley shall be filled, and every mountain and hill shall be brought low.","Segunda semana de Adviento: lo que está hundido se levanta y lo que es orgullo se baja.","Second week of Advent: what is sunk is lifted up, and what is pride is brought low.","Enciendan la segunda vela y armen juntos (o terminen) el pesebre de la casa.","Light the second candle and build (or finish) the family nativity scene together."],
["Luz","Light","Juan 8:12","John 8:12","Yo soy la luz del mundo: el que me sigue, no andará en tinieblas, mas tendrá la lumbre de la vida.","I am the light of the world: he that followeth me shall not walk in darkness, but shall have the light of life.","Es la noche de las velitas: cada vela que prendemos dice que la oscuridad no tiene la última palabra.","It's the Night of the Little Candles: every candle we light says darkness doesn't have the last word.","Noche de velitas en familia, con cuidado: velas lejos de los niños, de cortinas y de la pólvora.","Family candle night, safely: keep candles away from kids, curtains and fireworks."],
["María","Mary","Lucas 1:38","Luke 1:38","Entonces María dijo: He aquí la criada del Señor; hágase a mí conforme a tu palabra.","And Mary said, Behold the handmaid of the Lord; be it unto me according to thy word.","Día de la Inmaculada. El sí de María fue valiente: dijo que sí sin tener todo el mapa.","Feast of the Immaculate Conception. Mary's yes was brave: she said yes without the whole map.","Recen juntos un Avemaría por las madres y abuelas de la familia.","Pray a Hail Mary together for the mothers and grandmothers in the family."],

["Servicio","Service","Gálatas 5:13","Galatians 5:13","Servíos por amor los unos a los otros.","By love serve one another.","Servir es la forma más concreta de querer.","Serving is the most concrete way to love.","Ayuden a un vecino o a un adulto mayor con algo práctico.","Help a neighbor or an older person with something practical."],
["Paciencia","Patience","Santiago 5:7","James 5:7","Pues, hermanos, tened paciencia hasta la venida del Señor.","Be patient therefore, brethren, unto the coming of the Lord.","El labrador espera la lluvia sin desesperar. Lo que vale la pena madura despacio.","The farmer waits for the rain without despair. What's worth having ripens slowly.","Cuando algo los impaciente hoy, respiren tres veces antes de responder.","When something makes you impatient today, take three breaths before answering."],

const store={get(k,d){try{return JSON.parse(localStorage.getItem('adv_'+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem('adv_'+k,JSON.stringify(v))}catch(e){}}};
let lang=store.get('lang',(navigator.language||'es').startsWith('en')?'en':'es');
let done=store.get('done',[]);let fam=store.get('fam',[]);let openIdx=null;
const L=()=>T[lang];const W=i=>D[i][lang==='en'?1:0];
const $=id=>document.getElementById(id);

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}

/* ---------- Render ---------- */
function renderStatic(){
  document.documentElement.lang=lang;$('langBtn').textContent=lang==='es'?'EN':'ES';
  document.querySelectorAll('[data-t]').forEach(e=>{const v=L()[e.dataset.t];if(typeof v==='string')e.textContent=v});
  document.querySelectorAll('[data-h]').forEach(e=>e.innerHTML=L()[e.dataset.h]);
  $('famIn').placeholder=L().ph;
  $('novList').innerHTML=L().novItems.map(x=>`<li>${x}</li>`).join('');
  $('waBtn').href='https://wa.me/?text='+encodeURIComponent(L().waMsg+' '+location.href.split('#')[0]);
}
function streak(){const t=Math.min(dayIndexNow(),N-1);let s=0;for(let i=t;i>=0;i--){if(done.includes(i))s++;else if(i<t)break;}return s}
function renderToday(){
  const i=dayIndexNow();let h=`<div class="date">${L().todayLbl} · ${new Date().toLocaleDateString(lang==='en'?'en-US':'es-CO',{weekday:'long',day:'numeric',month:'long',timeZone:'America/Bogota'})}</div>`;
  if(i<0)h+=`<h2>${L().readFirst}</h2><p>${L().before(Math.ceil((START-nowCO())/DAY))}</p>`;
  else if(i<N)h+=`<h2>${W(i)}</h2><p>${L().during(i,W(i))}</p>`;
  else h+=`<h2>${L().ended}</h2><p>${L().after}</p>`;
  const p=Math.round(done.length/N*100);
  h+=`<div class="prog"><div class="ring" style="--p:${p}"><b>${p}%</b></div><div><b>${L().done(done.length)}</b><br><span style="opacity:.8">${L().streak(streak())}</span><br>
  <button class="btn2" onclick="openDay(${Math.max(0,Math.min(i,N-1))})">${i<0?L().readFirst:L().readToday}</button></div></div>`;
  $('today').innerHTML=h;
}
function renderDays(){
  const t=dayIndexNow();
  $('days').innerHTML=D.map((d,i)=>`<button class="day ${done.includes(i)?'done':''} ${i===t?'is-today':''} ${i>=NOV_START&&i<NOV_START+9?'nov':''}" data-i="${i}"><span class="n">${L().day} ${i+1}</span><span class="w"><small>${shortDate(i,lang)}</small><b>${W(i)}</b></span></button>`).join('');
  $('days').querySelectorAll('.day').forEach(b=>{const k=+b.dataset.i;if(k===7||k===25)b.style.backgroundImage='url("pesebre-familia.jpg")';else bg(b,k,400);b.onclick=()=>openDay(+b.dataset.i)});
  $('grid').innerHTML=D.map((d,i)=>`<button class="cell ${done.includes(i)?'done':''} ${i===t?'is-today':''} ${i>=NOV_START&&i<NOV_START+9?'nov':''}" onclick="openDay(${i})" aria-label="${L().day} ${i+1}">${i+1}</button>`).join('');
  const el=$('days').querySelector('.is-today');if(el)$('days').scrollLeft=el.offsetLeft-18;
}
function renderWeeks(){
  const t=dayIndexNow();const wk=t<0?-1:Math.min(3,Math.floor(t/7));
  $('weeks').innerHTML=L().weeks.map((w,i)=>`<div class="wk ${i<=wk?'lit':''}" data-k="${[1,6,4,9][i]}"><div class="t"><small>${w[0]} · ${shortDate(i*7,lang)}</small><b>${w[1]}</b></div></div>`).join('');
  $('weeks').querySelectorAll('.wk').forEach(e=>bg(e,+e.dataset.k,500));
}
function renderFam(){$('chips').innerHTML=fam.map((n,i)=>`<span class="chip">${n.replace(/[<>&]/g,'')}<button onclick="delFam(${i})" aria-label="x">×</button></span>`).join('')}
function delFam(i){fam.splice(i,1);store.set('fam',fam);renderFam()}

/* ---------- Lector del día ---------- */
function openDay(i){
  const wasOpen=openIdx!=null;openIdx=i;const d=D[i],en=lang==='en';
  const nov=i>=NOV_START&&i<NOV_START+9?` · Novena ${i-NOV_START+1}`:'';
  $('sheet').innerHTML=`<div class="sh-hero" id="shHero"><button class="close" onclick="closeDay()">${L().close}</button><div class="t"><small>${L().day} ${i+1}${nov} · ${dateOf(i,lang)}</small><h3>${W(i)}</h3></div></div>
  <div class="sh-body"><p class="verse">“${d[en?5:4]}”</p><p class="ref">${d[en?3:2]} · ${en?'KJV':'RV 1909'}</p>
  <div class="blk"><h4>${L().refl}</h4><p>${d[en?7:6]}</p></div>
  <div class="blk"><h4>${L().pray}</h4><p>${L().prayTxt(W(i))}</p></div>
  <div class="blk ch"><h4>${L().chal}</h4><p>${d[en?9:8]}</p></div>
  ${nov?`<div class="blk"><h4>Novena</h4><p>${L().novItems.join(' · ')}</p><div class="gozo">${L().gozo}</div><button class="btn2" onclick="irNovena(${i-NOV_START})">${L().rezarHoy}</button></div>`:''}
  ${fam.length?`<div class="blk"><h4>${L().famT}</h4><p>${fam.join(', ')}</p></div>`:''}</div>`;
  if(i===7||i===25){$('shHero').style.backgroundImage='url("pesebre-familia.jpg")'}else bg($('shHero'),i,1100);
  $('sheet').classList.add('open');$('sheet').scrollTop=0;document.body.style.overflow='hidden';
  updateMark();$('markbar').classList.add('show');$('fab').classList.add('hide');if(!wasOpen)history.pushState({d:i},'','#dia-'+(i+1));else history.replaceState({d:i},'','#dia-'+(i+1));
}
function updateMark(){
  const b=$('markBtn'),i=openIdx;const can=dayIndexNow()>=i;
  if(done.includes(i)){b.textContent=L().marked;b.className='ok';b.disabled=false}
  else if(!can){b.textContent=L().locked(shortDate(i,lang));b.className='';b.disabled=true}
  else{b.textContent=L().mark;b.className='';b.disabled=false}
}
function closeDay(fromPop){$('fab').classList.remove('hide');$('sheet').classList.remove('open');$('markbar').classList.remove('show');document.body.style.overflow='';openIdx=null;if(!fromPop&&location.hash)history.back()}
$('markBtn').onclick=()=>{const i=openIdx;if(i==null||typeof i==='string')return;if(done.includes(i))done=done.filter(x=>x!==i);else{done.push(i);toast(L().toastDone)}store.set('done',done);updateMark();renderAll(false)};
window.addEventListener('popstate',()=>{if(openIdx!=null)closeDay(true)});

/* ---------- Cuenta regresiva ---------- */
function tick(){
  const ms=START-nowCO(),i=dayIndexNow();
  if(ms>0){const d=Math.floor(ms/DAY),h=Math.floor(ms%DAY/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);
    $('count').innerHTML=[[d,L().d],[h,L().h],[m,L().m],[s,L().s]].map(x=>`<div><b>${String(x[0]).padStart(2,'0')}</b><span>${x[1]}</span></div>`).join('');
    $('when').innerHTML=`${L().starts} · <em>${L().left(Math.ceil(ms/DAY))}</em>`;}
  else{$('count').innerHTML='';$('when').innerHTML=i<N?`<em>${L().running}</em> · ${L().day.toUpperCase()} ${i+1}/${N}`:`<em>${L().ended}</em>`}
}

/* ---------- Recordatorio .ics ---------- */
$('calBtn').onclick=e=>{e.preventDefault();
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Vibras Positivas HM//Adviento//ES","BEGIN:VTIMEZONE","TZID:America/Bogota","BEGIN:STANDARD","DTSTART:19700101T000000","TZOFFSETFROM:-0500","TZOFFSETTO:-0500","TZNAME:COT","END:STANDARD","END:VTIMEZONE",
  "BEGIN:VEVENT","UID:adviento-familia-2026@vibraspositivashm","DTSTAMP:20261124T120000Z","DTSTART;TZID=America/Bogota:20261129T190000","DTEND;TZID=America/Bogota:20261129T193000","RRULE:FREQ=DAILY;COUNT=27",
  "SUMMARY:"+L().calFile,"DESCRIPTION:"+location.href.split('#')[0],"BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY","DESCRIPTION:"+L().calFile,"END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='reto-adviento.ics';a.click();};

$('famAdd').onclick=()=>{const v=$('famIn').value.trim();if(!v)return;fam.push(v);store.set('fam',fam);$('famIn').value='';renderFam();toast(L().toastFam)};
$('famIn').onkeydown=e=>{if(e.key==='Enter')$('famAdd').click()};
$('ctaBtn').onclick=()=>{const i=dayIndexNow();openDay(Math.max(0,Math.min(i,N-1)))};
$('langBtn').onclick=()=>{lang=lang==='es'?'en':'es';store.set('lang',lang);renderAll(true);if(typeof openIdx==='string')openReceta(+openIdx.slice(1));else if(openIdx!=null)openDay(openIdx)};


/* ---------- Novena completa y villancicos ---------- */
let novDia=Math.min(8,Math.max(0,dayIndexNow()-NOV_START));
let fs=store.get('fs',1);
function esc(t){return String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function paso(k,b,open,cls=''){return `<details class="paso ${cls}" ${open?'open':''}><summary><span><span class="k">${k}</span>${b.t}</span></summary><div class="tx">${(b.p||[]).map(x=>`<p>${esc(x)}</p>`).join('')}${b.nota?`<p class="nota">${b.nota}</p>`:''}</div></details>`}
function renderNovena(){
  const N_=NOVENA[lang],ES=NOVENA.es,hoy=dayIndexNow()-NOV_START;
  $('novOrden').textContent=N_.orden;
  $('ntabs').innerHTML=N_.dias.map((d,i)=>`<button class="ntab ${i===novDia?'on':''} ${i===hoy?'hoy':''}" onclick="selNov(${i})">${L().day} ${i+1}<small>${16+i} dic</small></button>`).join('');
  const d=N_.dias[novDia];let n=0;const step=()=>`${++n}`;
  const g=N_.gozos,estrofas=ES.gozos.estrofas;
  const gozosHtml=`<details class="paso"><summary><span><span class="k">6</span>${g.t}</span></summary><div class="tx">
    <p class="coro">${L().coroL}: ${ES.gozos.coro}</p>${lang==='en'?`<p class="nota">${g.coro}</p>`:''}
    ${estrofas.map(e=>`<p class="estrofa">${esc(e)}</p><p class="coro">${ES.gozos.coroCorto}</p>`).join('')}</div></details>`;
  n=0;
  $('rezo').innerHTML=
    paso('1',N_.inicio,false)+
    paso('2',N_.todosLosDias,false)+
    `<details class="paso cons" open><summary><span><span class="k">3 · ${esc(d[0])}</span>${esc(d[1])}</span></summary><div class="tx">${d.slice(2).map(x=>`<p>${esc(x)}</p>`).join('')}</div></details>`+
    paso('4',N_.virgen,false)+
    paso('5',N_.jose,false)+
    gozosHtml+
    paso('7',N_.nino,false)+
    `<details class="paso"><summary><span><span class="k">+</span>${N_.basicas.t}</span></summary><div class="tx">${N_.basicas.items.map(x=>`<p><b>${x[0]}</b><br>${esc(x[1])}</p>`).join('')}</div></details>`;
  $('villList').innerHTML=VILLANCICOS.map((v,i)=>`<details class="vill"><summary data-k="${[3,0,8,2,5,1,7,9,4][i]}"><span class="t"><b>${v.t}</b><small>${lang==='en'?v.en:'Villancico tradicional'}</small></span></summary><div class="tx">
    ${v.v.map(x=>`<p>${esc(x)}</p>${v.coro?`<p class="coro">${esc(v.coro)}</p>`:''}`).join('')}</div></details>`).join('');
  $('villList').querySelectorAll('.vill summary').forEach(e=>{const k=+e.dataset.k;if(k===3||k===5)e.style.backgroundImage='url("pesebre-familia.jpg")';else bg(e,k,700)});
  document.querySelectorAll('.rezo').forEach(e=>e.style.setProperty('--fs',fs));
}
function selNov(i){novDia=i;renderNovena()}
function irNovena(i){closeDay();novDia=i;renderNovena();setTimeout(()=>$('novena').scrollIntoView({behavior:'smooth'}),350)}
$('fsPlus').onclick=()=>{fs=Math.min(1.6,+(fs+.1).toFixed(1));store.set('fs',fs);renderNovena()};
$('fsMinus').onclick=()=>{fs=Math.max(.9,+(fs-.1).toFixed(1));store.set('fs',fs);renderNovena()};

/* ---------- Recetas de diciembre ---------- */
const REC_BG=["linear-gradient(135deg,#7a3b12,#d98b3a)","linear-gradient(135deg,#8a5a12,#e0a93b)","linear-gradient(135deg,#9a3a1c,#e4572e)","linear-gradient(135deg,#5c3a21,#c99a63)","linear-gradient(135deg,#1f5132,#6fa35a)","linear-gradient(135deg,#a8461e,#f2a541)","linear-gradient(135deg,#4b3a6b,#b98fc7)"];
function recImg(r,i){return r.video?`url("https://i.ytimg.com/vi/${r.video}/hqdefault.jpg"), ${REC_BG[i%REC_BG.length]}`:REC_BG[i%REC_BG.length]}
function renderRecetas(){
  $('recs').innerHTML=RECETAS.map((r,i)=>{const x=r[lang];return `<button class="rec" style='background-image:${recImg(r,i)}' onclick="openReceta(${i})"><span class="vd">${r.video?L().conVideo:L().verVideo}</span><span class="w"><b>${x.t}</b><small>${x.d}</small></span></button>`}).join('');
}
function openReceta(i){
  const r=RECETAS[i],x=r[lang],yt='https://www.youtube.com/results?search_query='+encodeURIComponent(r.buscar);
  const wasOpen=openIdx!=null;openIdx='r'+i;
  const txt=`*${x.t}*\n\n${L().ingL}:\n${x.ing.map(a=>'- '+a).join('\n')}\n\n${L().pasL}:\n${x.pasos.map((a,k)=>(k+1)+'. '+a).join('\n')}\n\n${location.href.split('#')[0]}#recetas`;
  $('sheet').innerHTML=`${r.video?`<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${r.video}?rel=0&playsinline=1" title="${esc(x.t)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`:`<div class="sh-hero" style="height:30svh;min-height:200px;background:${REC_BG[i%REC_BG.length]}"><div class="t"><small>${L().recT}</small><h3>${x.t}</h3></div></div>`}
  <button class="close" style="position:fixed;z-index:103" onclick="closeDay()">${L().close}</button>
  <div class="rh"><small>${x.rinde}</small>${r.video?`<h3>${x.t}</h3>`:''}<p>${x.d}</p></div>
  <div class="sh-body rezo" style="padding-top:12px">
    <a class="yt" href="${yt}" target="_blank" rel="noopener">${L().ytL}</a>
    <div class="blk" style="margin-top:14px"><h4>${L().ingL}</h4><p class="lead" style="margin:0 0 4px;font-size:13px">${L().ingTip}</p><ul class="ing">${x.ing.map(a=>`<li onclick="this.classList.toggle('ok')">${esc(a)}</li>`).join('')}</ul></div>
    <div class="blk"><h4>${L().pasL}</h4><ol class="pas">${x.pasos.map(a=>`<li>${esc(a)}</li>`).join('')}</ol></div>
    <div class="blk ch"><h4>${L().tipL}</h4><p>${esc(x.tip)}</p></div>
    <a class="yt wa" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">${L().waR}</a>
  </div>`;
  document.querySelectorAll('.rezo').forEach(e=>e.style.setProperty('--fs',fs));
  $('sheet').classList.add('open');$('sheet').scrollTop=0;document.body.style.overflow='hidden';$('markbar').classList.remove('show');$('fab').classList.add('hide');
  if(!wasOpen)history.pushState({r:i},'','#receta-'+r.id);else history.replaceState({r:i},'','#receta-'+r.id);
}
$('fab').onclick=()=>$('recetas').scrollIntoView({behavior:'smooth'});

function renderAll(full=true){if(full){renderStatic();renderWeeks();renderFam();renderNovena();renderRecetas()}renderToday();renderDays();tick()}

/* ---------- Hero: fotos que cambian + destellos ---------- */
const sl=$('slides');{const d=document.createElement('div');d.style.backgroundImage='url("pesebre-familia.jpg")';d.style.backgroundPosition='38% 70%';d.className='on';sl.appendChild(d)}
[0,2,1,7].forEach(k=>{const d=document.createElement('div');bg(d,k,1400);sl.appendChild(d)});
let si=0;setInterval(()=>{const s=sl.children;s[si].classList.remove('on');si=(si+1)%s.length;s[si].classList.add('on')},5500);
for(let i=0;i<18;i++){const s=document.createElement('span');s.className='spark';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*70+'%';s.style.animationDelay=Math.random()*3+'s';$('inicio').appendChild(s)}
$('novImg').style.backgroundImage='url("pesebre-familia.jpg")';

window.addEventListener('scroll',()=>document.querySelector('.top').classList.toggle('solid',scrollY>innerHeight*.7),{passive:true});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(e=>io.observe(e));

renderAll(true);setInterval(tick,1000);
setInterval(()=>{renderToday();renderWeeks()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderAll(false)});
const mr=location.hash.match(/receta-(\w+)/);if(mr){const k=RECETAS.findIndex(r=>r.id===mr[1]);if(k>=0)setTimeout(()=>openReceta(k),300)}
const m=location.hash.match(/dia-(\d+)/);if(m){const i=+m[1]-1;if(i>=0&&i<N)setTimeout(()=>openDay(i),300)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
